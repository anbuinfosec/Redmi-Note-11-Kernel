name: Build NetHunter Kernel (spes)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip bc bison flex \
            build-essential libssl-dev libelf-dev \
            ccache python3 python-is-python3 \
            device-tree-compiler rsync lld llvm \
            libncurses5-dev libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Set Build Variables
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Configure Kernel
        run: |
          mkdir -p out

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/spes_defconfig

      - name: Build Kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3

      - name: Prepare ZIP
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/ || true
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ || true
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || true
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 "../NetHunter-spes-${{ github.run_number }}.zip" ./*

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-spes
          path: NetHunter-spes-${{ github.run_number }}.zip
