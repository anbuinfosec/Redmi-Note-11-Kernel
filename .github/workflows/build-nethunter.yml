name: Build Redmi Note 11 NetHunter Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - Neutrino_r05

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      TZ: Asia/Dhaka
      CI: true
      GITHUB_ACTIONS: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip rsync bc bison flex \
            build-essential ccache \
            python3 python-is-python3 \
            libssl-dev libelf-dev \
            libncurses5-dev libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang lld llvm

      - name: Enable ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Show repository
        run: |
          pwd
          ls -la

      - name: Build kernel
        run: |
          bash ./build.sh

      - name: Collect artifacts
        run: |
          mkdir artifacts

          find . -type f \( \
            -name "*.zip" -o \
            -name "Image" -o \
            -name "Image.gz" -o \
            -name "Image.gz-dtb" -o \
            -name "dtbo.img" -o \
            -name "boot.img" -o \
            -name "vendor_boot.img" \
          \) -exec cp {} artifacts/ \; || true

          find . -type f -name "*.log" -exec cp {} artifacts/ \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-Note-11-Kernel
          path: artifacts/
          if-no-files-found: warn
